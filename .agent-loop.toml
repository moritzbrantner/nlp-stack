schema_version = 1
max_workers = 2

[verification]
# Restructuring-first publication evidence is intentionally structural. The
# maintainer accepts that the fast-continuation branch is statically reviewed
# and untested; behavioral, integration, consumer, and sensitivity suites are
# not publication gates.
commands = [
  "cargo metadata --format-version 1 --no-deps",
  "python3 scripts/check_release_plan.py --check releases/nlp-wave-1.toml",
  "python3 scripts/publish_release.py --check-safeguards",
]

[publication]
command = "NLP_RELEASE_FAST_CONTINUATION=1 python3 scripts/publish_release.py"
authorization_label = "release:approved"
