name: clippy-probe

on:
  push:
    branches: [feat/semantic-h4-h9-baseline]

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Capture text-analysis Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy -p moenarch-text-analysis --all-targets -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          echo "$status" > clippy-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-clippy-log
          path: |
            clippy.log
            clippy-exit.txt
