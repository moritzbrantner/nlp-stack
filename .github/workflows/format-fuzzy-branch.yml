name: Format fuzzy search branch

on:
  push:
    branches:
      - feat/fuzzy-text-index-search

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fuzzy-text-index-search
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and remove helper workflow
        run: |
          cargo fmt -p moenarch-text-index
          rm .github/workflows/format-fuzzy-branch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/text/text-index .github/workflows/format-fuzzy-branch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(text-index): apply rustfmt [formatted]'
          git push origin HEAD:feat/fuzzy-text-index-search
