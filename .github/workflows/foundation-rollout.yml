name: Foundation rollout

on:
  push:
    branches:
      - rollout/environment-v1

permissions:
  contents: write

jobs:
  apply-environment:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout platform-upgrader
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/platform-upgrader
          ref: 60d3188f0193f42c2f2aab473de81fd7e7bad487
          path: .foundation-sources/platform-upgrader
          persist-credentials: false

      - name: Checkout coding-tooling authority
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: dfd459a3f5d6858ae813dca9e1e8442c3dd0cc17
          path: .foundation-sources/coding-tooling
          persist-credentials: false

      - name: Set up Bun for authority tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Apply authoritative boring foundation slice
        run: |
          node .foundation-sources/platform-upgrader/src/cli.js apply boring-foundation-v1 "$GITHUB_WORKSPACE" \
            --coding-tooling-root "$GITHUB_WORKSPACE/.foundation-sources/coding-tooling"
          rm -rf .foundation-sources

      - name: Commit environment-v1 artifacts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .repository-environment.toml scripts/codex-environment.sh
          git diff --cached --quiet && exit 0
          git commit -m "chore: adopt environment-v1"
          git push origin HEAD
