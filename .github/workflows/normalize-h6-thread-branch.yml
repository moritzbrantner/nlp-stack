name: normalize-h6-thread-branch

on:
  push:
    branches: [feat/conversation-semantic-threads]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Export thread types and apply rustfmt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/text/text-analysis/src/lib.rs')
          text = path.read_text()
          old = 'ConceptIntroduction, ConversationSemanticDynamics, ConversationTurn, RecurringConcept,'
          new = 'ConceptIntroduction, ConversationSemanticDynamics, ConversationSemanticThread,\n    ConversationSemanticThreadSegment, ConversationThreadInterleaving, ConversationTurn,\n    RecurringConcept,'
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new, 1))
          elif 'ConversationSemanticThreadSegment' not in text:
              raise SystemExit(f'expected one semantic root re-export match, got {count}')
          PY
          cargo fmt --all
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --update
          git commit -m "style: normalize H6 semantic thread API"
          git push origin HEAD:feat/conversation-semantic-threads
