name: pages lock bootstrap

on:
  push:
    branches: [feat/github-pages]
    paths:
      - "web/package.json"
      - ".github/workflows/pages-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/github-pages
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Regenerate Bun lockfile
        working-directory: web
        run: bun install --lockfile-only
      - name: Commit lockfile and remove bootstrap
        run: |
          git rm .github/workflows/pages-lock-bootstrap.yml
          git add web/bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pages): refresh web dependency lock"
          git push origin HEAD:feat/github-pages
