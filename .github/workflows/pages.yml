name: pages

on:
  pull_request:
    paths:
      - "web/**"
      - "packages/nlp-app-ui/**"
      - "packages/text-core-wasm/**"
      - "packages/text-analysis-wasm/**"
      - "crates/bindings/text-core-wasm/**"
      - "crates/bindings/text-analysis-wasm/**"
      - "crates/text/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/nlp-app-ui/**"
      - "packages/text-core-wasm/**"
      - "packages/text-analysis-wasm/**"
      - "crates/bindings/text-core-wasm/**"
      - "crates/bindings/text-analysis-wasm/**"
      - "crates/text/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      NEXT_TELEMETRY_DISABLED: 1
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Build shared React package
        run: bun run nlp-app-ui:build
      - name: Build browser Wasm assets
        run: bash web/scripts/build-wasm-assets.sh
      - name: Install Pages dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Unit tests
        working-directory: web
        run: bun run test
      - name: Typecheck
        working-directory: web
        run: bun run typecheck
      - name: Storybook build
        working-directory: web
        run: bun run storybook:build
      - name: Build local-path export for browser smoke
        working-directory: web
        run: GITHUB_ACTIONS=false bun run build
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke
        working-directory: web
        run: bun run e2e
      - name: Build GitHub Pages export
        working-directory: web
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
