name: rustfmt-probe

on:
  push:
    branches: [feat/semantic-h4-h9-baseline]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --update
          git commit -m "style: apply rustfmt to H4-H9 baseline"
          git push origin HEAD:feat/semantic-h4-h9-baseline
