name: temporary-vector-audit
on:
  push:
    branches: [audit/nlp-vector-validation]
permissions:
  contents: write
concurrency:
  group: nlp-vector-validation
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      BASE: 495a83b23c0454e4ad9a6ffba9dfec634e89472e
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Prepare narrowly scoped source patch on the reviewed parent
        run: |
          mkdir -p "$RUNNER_TEMP/nlp-audit"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/nlp-audit-target" >> "$GITHUB_ENV"
          git fetch --depth=1 origin "$BASE"
          git switch --detach "$BASE"
          git checkout "$GITHUB_SHA" -- crates/text/text-index/src/surface/fuzzy/vector_reads.rs scripts/benchmark_lexical_vectors.py scripts/test_benchmark_lexical_vectors.py
          git show "$GITHUB_SHA:scripts/prepare_lexical_vector_audit.py" | python3
          cargo fmt --all
          # The runner may push source but cannot update workflows. The existing
          # authorized connector will apply that separately after inspection.
          git restore --source "$BASE" -- .github/workflows/fuzzy-distance-evidence.yml
          git diff --exit-code Cargo.lock
          git add crates/text/text-index/src/lib.rs crates/text/text-index/src/surface/fuzzy.rs crates/text/text-index/src/surface/fuzzy/vector_reads.rs scripts/benchmark_lexical_vectors.py scripts/test_benchmark_lexical_vectors.py docs/verification/lexical-vector-audit.md
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(text-index): isolate lexical search from unused vector storage' -m 'Add adversarial vector-store regressions and paired query-only before/after evidence. Refs #98.'
          git diff "$BASE" HEAD > "$RUNNER_TEMP/nlp-audit/change.patch"
          git archive -o "$RUNNER_TEMP/nlp-audit/source.tar" HEAD
      - name: Strict crate lint and complete memory and SQLite tests
        run: |
          cargo clippy --locked -p moenarch-text-index --all-targets --features sqlite -- -D warnings 2>&1 | tee "$RUNNER_TEMP/nlp-audit/clippy.log"
          cargo test --locked -p moenarch-text-index --no-default-features 2>&1 | tee "$RUNNER_TEMP/nlp-audit/memory.log"
          cargo test --locked -p moenarch-text-index --features sqlite 2>&1 | tee "$RUNNER_TEMP/nlp-audit/sqlite.log"
          python3 -m unittest discover -s scripts -p 'test_benchmark_lexical_vectors.py'
      - name: Reproduce old failures and compare native query timings
        run: python3 scripts/benchmark_lexical_vectors.py --iterations 10 --samples 5 --output "$RUNNER_TEMP/nlp-audit/lexical-vectors.json" 2>&1 | tee "$RUNNER_TEMP/nlp-audit/comparison.log"
      - name: Publish validated result to a separate evidence branch
        run: |
          result_branch="audit/nlp-vector-result-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$result_branch"
          python3 - "$result_branch" > "$RUNNER_TEMP/nlp-audit/result.json" <<'PY'
          import json, subprocess, sys
          print(json.dumps({"branch": sys.argv[1], "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nlp-vector-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nlp-audit
          if-no-files-found: warn
          retention-days: 90
