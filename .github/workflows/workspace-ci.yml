name: workspace-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Install Bun workspace
        run: bun install --frozen-lockfile
      - name: Ownership and release validators
        run: |
          cargo metadata --format-version 1 --no-deps
          python3 scripts/check_repository_boundaries.py --check
          python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features
      - name: Test no default features
        run: cargo test --workspace --no-default-features
      - name: Documentation
        run: cargo doc --workspace --no-deps
      - name: Focused package-surface adapter
        run: bun run nlp-app-ui:test
      - name: Text apps
        run: |
          bun run text-app:typecheck
          bun run text-app:build
      - name: WASM pack/install smoke
        run: bun run text-wasm:test:all
      - name: Package all Rust crates without publishing
        run: python3 scripts/check_release_plan.py --package-all docs/repository-split/release-plan.json
