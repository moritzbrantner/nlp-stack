name: workspace-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment-validation: ${{ steps.scope.outputs.environment-validation }}
      pages-validation: ${{ steps.scope.outputs.pages-validation }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT: ${{ toJSON(github.event) }}
        run: |
          import json
          import os
          import re
          import subprocess

          # Preserve GitHub path-filter semantics, including both paths of a rename.
          def matches(path, pattern):
              parts = re.split(r"(\*\*/|\*\*|\*|\?)", pattern)
              expression = "".join({"**/": "(?:.*/)?", "**": ".*", "*": "[^/]*", "?": "[^/]"}.get(part, re.escape(part)) for part in parts)
              return re.fullmatch(expression, path) is not None

          def included(value, patterns):
              selected = False
              for pattern in patterns:
                  negative = pattern.startswith("!")
                  if matches(value, pattern[1:] if negative else pattern):
                      selected = not negative
              return selected

          specs = {'environment-validation': {'paths': ['.repository-environment.toml', '.coding-tooling.source-deps.json', 'scripts/codex-environment.sh', 'scripts/check-agent-readiness.sh', 'scripts/check_agent_readiness_contract.py', 'package.json', 'bun.lock', '.node-version', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.github/workflows/environment-v1.yml']}, 'pages-validation': {'paths': ['web/**', 'scripts/check-pages.sh', 'package.json', 'bun.lock', 'packages/nlp-app-ui/**', 'packages/text-core-wasm/**', 'packages/text-analysis-wasm/**', 'crates/bindings/text-core-wasm/**', 'crates/bindings/text-analysis-wasm/**', 'crates/text/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/pages.yml']}}
          pr = os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          event = json.loads(os.environ.get("PR_EVENT", "{}"))
          paths = []
          if pr:
              raw = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]])
              paths = [path for path in raw.decode().split("\0") if path]
          docs_only = pr and bool(paths) and all(path.endswith(".md") for path in paths)
          selected = {}
          for job, spec in specs.items():
              active = pr
              if active and spec.get("branches"):
                  active = included(event["pull_request"]["base"]["ref"], spec["branches"])
              if active and spec.get("branches-ignore"):
                  active = not included(event["pull_request"]["base"]["ref"], spec["branches-ignore"])
              if active and paths and spec.get("paths"):
                  active = any(included(path, spec["paths"]) for path in paths)
              if active and paths and spec.get("paths-ignore"):
                  active = any(not included(path, spec["paths-ignore"]) for path in paths)
              # An empty comparison is not evidence that a required validation is out of scope.
              selected[job] = active
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              skipped = [job for job, active in selected.items() if not active]
              if docs_only:
                  skipped.extend(["verify"])
              print("allow-skipped=" + json.dumps(skipped), file=output)
              print("docs-only=" + str(docs_only).lower(), file=output)

  verify:
    needs: validation-scope
    if: needs.validation-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install wasm-pack
        uses: moritzbrantner/reusable-workflows/.github/actions/install-verified-wasm-cli@e60855ad67f3dad72c283c355d544d6d296241d7
        with:
          tool: wasm-pack
          version: "0.14.0"
      - name: Install Bun workspace
        run: bun install --frozen-lockfile
      - name: Ownership and release validators
        run: |
          cargo metadata --format-version 1 --no-deps
          python3 scripts/check_repository_boundaries.py --check
          python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Model feature compatibility
        run: bash scripts/check-model-feature-compatibility.sh registry
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Reclaim space after lint
        run: cargo clean
      - name: Test default features
        run: cargo test --workspace
      - name: Test no default features
        run: cargo test --workspace --no-default-features
      - name: Reclaim space before documentation
        run: cargo clean
      - name: Documentation
        run: cargo doc --workspace --no-deps
      - name: Focused package-surface adapter
        run: bun run nlp-app-ui:test
      - name: Text apps
        run: |
          bun run text-app:typecheck
          bun run text-app:build
      - name: WASM pack/install smoke
        run: bun run text-wasm:test:all
      - name: Reclaim space before packaging
        run: cargo clean
      - name: Package all Rust crates without publishing
        run: python3 scripts/check_release_plan.py --package-all docs/repository-split/release-plan.json

      - name: Diagnose exact environment after workspace CI failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@81da4fbbdbe75a8937716cbab0b9a47c447269e8
        with:
          operation: environment-verify
          bun-version: 1.3.14
          report-path: .artifacts/environment/workspace.json
          install-mode: none

  environment-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.environment-validation == 'true'
    uses: ./.github/workflows/environment-v1.yml
    secrets: inherit
    permissions:
      contents: read

  pages-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.pages-validation == 'true'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["verify", "validation-scope", "environment-validation", "pages-validation"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["verify", "validation-scope", "environment-validation", "pages-validation"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
