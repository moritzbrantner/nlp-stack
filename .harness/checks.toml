schema_version = 1

[[checks]]
id = "bun-install"
command = ["bun", "install", "--frozen-lockfile"]
scope = ["package.json", "bun.lock", "packages/**"]
tier = "full"
blocking = true
evidence_classes = ["integration"]
protected_properties = ["INV-002", "INV-004"]
source_of_truth = ["issue:#113", "repo:CONTEXT.md"]
state_class = "deterministic"
timeout_seconds = 600
tools = ["bun"]
services = []
generated_outputs = ["node_modules/**", "packages/*/node_modules/**"]
cost_class = "medium"
success_exit_codes = [0]
failure_semantics = "The Bun workspace cannot install from the reviewed lockfile in a clean checkout."
independence_group = "bun-resolution"

[[checks]]
id = "metadata"
command = ["cargo", "metadata", "--format-version", "1", "--no-deps"]
scope = ["Cargo.toml", "Cargo.lock", "crates/**"]
tier = "full"
blocking = true
evidence_classes = ["static"]
protected_properties = ["INV-001", "INV-002"]
source_of_truth = ["issue:#113", "issue:#106", "invariant:INV-001"]
state_class = "deterministic"
timeout_seconds = 300
tools = ["cargo"]
services = []
generated_outputs = ["target/**"]
cost_class = "low"
success_exit_codes = [0]
failure_semantics = "Cargo metadata cannot resolve the exact reviewed workspace."
independence_group = "cargo-metadata"

[[checks]]
id = "validator-tests"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_*.py"]
scope = ["scripts/**", "docs/repository-split/**", "Cargo.toml", "Cargo.lock", "package.json", "bun.lock", "packages/*/package.json"]
tier = "full"
blocking = true
evidence_classes = ["behavioral"]
protected_properties = ["INV-002", "INV-003"]
source_of_truth = ["issue:#113", "issue:#106", "invariant:INV-002", "invariant:INV-003"]
state_class = "deterministic"
timeout_seconds = 600
tools = ["python3", "cargo"]
services = []
generated_outputs = ["target/**"]
cost_class = "medium"
success_exit_codes = [0]
failure_semantics = "Controlled-fault ownership or release validator tests failed."
independence_group = "validator-sensitivity"
sensitivity = [{ property = "INV-002", status = "proven", method = "controlled-fault", reference = "repo:scripts/test_check_repository_boundaries.py" }, { property = "INV-003", status = "proven", method = "controlled-fault", reference = "repo:scripts/test_check_release_plan.py" }]

