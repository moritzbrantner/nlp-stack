[workspace]
members = [
    "crates/text/*",
    "crates/bindings/text-*-wasm",
    "crates/bindings/nlp-package-registry-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/nlp-stack"
homepage = "https://github.com/moritzbrantner/nlp-stack"
documentation = "https://docs.rs/moenarch-nlp-stack"
keywords = ["text", "nlp", "language", "analysis", "retrieval"]
categories = ["text-processing", "science", "algorithms"]

[workspace.dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
clap = { version = "4.5.51", features = ["derive"] }
criterion = "0.8.0"
lingua = { version = "1.8.0", default-features = false, features = ["dutch", "english", "french", "german", "italian", "portuguese", "spanish"] }
regex = "1.13.1"
rusqlite = "0.41.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokenizers = { version = "0.23.0", default-features = false, features = ["unstable_wasm"] }
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"

# Registry coordinates remain the distribution contract. Normal development may
# activate the exact foundation source revision declared in
# .coding-tooling.source-deps.json; committed manifests stay registry-based.
data-inversion-core = { package = "moenarch-data-inversion-core", version = "=0.2.0" }
math-sparse-data = { package = "moenarch-math-sparse-data", version = "=0.2.0" }
media-core = { package = "moenarch-media-core", version = "=0.2.0" }
model-runtime = { package = "moenarch-model-runtime", version = "=0.1.1" }
runtime-core = { package = "moenarch-runtime-core", version = "=0.2.1" }
runtime-onnx = { package = "moenarch-runtime-onnx", version = "=0.1.1" }
vector-analysis-core = { package = "moenarch-vector-analysis-core", version = "=0.2.0" }
vector-analysis-index = { package = "moenarch-vector-analysis-index", version = "=0.2.0" }

text-analysis = { package = "moenarch-text-analysis", version = "=0.1.1", path = "crates/text/text-analysis" }
text-classification = { package = "moenarch-text-classification", version = "=0.1.1", path = "crates/text/text-classification" }
text-core = { package = "moenarch-text-core", version = "=0.1.1", path = "crates/text/text-core" }
text-embeddings = { package = "moenarch-text-embeddings", version = "=0.1.1", path = "crates/text/text-embeddings" }
text-generation = { package = "moenarch-text-generation", version = "=0.1.1", path = "crates/text/text-generation" }
text-generation-linguistics = { package = "moenarch-text-generation-linguistics", version = "=0.1.1", path = "crates/text/text-generation-linguistics" }
text-index = { package = "moenarch-text-index", version = "=0.1.1", path = "crates/text/text-index" }
text-lexical = { package = "moenarch-text-lexical", version = "=0.1.1", path = "crates/text/text-lexical" }
text-linguistics = { package = "moenarch-text-linguistics", version = "=0.1.1", path = "crates/text/text-linguistics" }
nlp-package-registry = { package = "moenarch-nlp-package-registry", version = "=0.1.0", path = "crates/text/nlp-package-registry" }
text-question-answering = { package = "moenarch-text-question-answering", version = "=0.1.1", path = "crates/text/text-question-answering" }
text-retrieval = { package = "moenarch-text-retrieval", version = "=0.1.1", path = "crates/text/text-retrieval" }
text-transcripts = { package = "moenarch-text-transcripts", version = "=0.1.3", path = "crates/text/text-transcripts" }

# Published 0.1.1 builds on ort 2.0.0-rc.12, which deadlocks instead of returning an
# error when ONNX Runtime is missing or older than 1.24 (#176, vox#159). The foundation
# source (ort rc.15) returns typed RuntimeUnavailable / RuntimeTooOld errors.
[patch.crates-io]
moenarch-runtime-onnx = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
# The optional `hnsw` feature of text-retrieval needs Foundation's unreleased
# `vector_analysis_index::hnsw` (moenarch-foundation#119). The vector index and
# the crates whose types it exchanges with NLP are pinned to one exact revision
# so a single copy of each is resolved; a release task replaces this pin.
moenarch-media-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "38136ee541d9567cf8b54a2f8b5b9fc3692a2d67" }
moenarch-vector-analysis-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "38136ee541d9567cf8b54a2f8b5b9fc3692a2d67" }
moenarch-vector-analysis-index = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "38136ee541d9567cf8b54a2f8b5b9fc3692a2d67" }

# The optional `hnsw` test builds graphs of thousands of vectors; unoptimized
# hnsw_rs makes that suite take minutes. Optimizing only these dependencies keeps
# debug tests fast without changing first-party code generation.
[profile.dev.package.hnsw_rs]
opt-level = 3

[profile.dev.package.anndists]
opt-level = 3
