[package]
name = "moenarch-text-analysis-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP API adapter for the text-analysis library crate."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "text-analysis-server"

[lib]
name = "text_analysis_server"

[[bin]]
name = "text-analysis-server"
path = "src/main.rs"

[dependencies]
runtime-core.workspace = true
clap.workspace = true
serde_json.workspace = true
text-analysis = { package = "moenarch-text-analysis", version = "0.1.0", path = "../text-analysis", features = ["candle"] }
text-model-runtime = { package = "moenarch-text-model-runtime", version = "0.1.0", path = "../text-model-runtime", features = ["candle"] }
[features]
default = []
cuda = ["text-analysis/cuda", "text-model-runtime/cuda"]
