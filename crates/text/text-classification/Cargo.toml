[package]
name = "moenarch-text-classification"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Concrete text classification, sentiment, and zero-shot classification contracts."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "text_classification"

[dependencies]
runtime-core.workspace = true
serde.workspace = true
serde_json.workspace = true
text-core.workspace = true
text-lexical.workspace = true
model-runtime = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
runtime-onnx = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[features]
default = []
model-bundles = ["dep:model-runtime"]
candle = ["model-bundles", "dep:tokenizers", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
onnx = ["model-bundles", "dep:tokenizers", "dep:runtime-onnx", "runtime-onnx/onnxruntime"]
local-models = ["candle", "onnx"]
external-tests = ["local-models"]

[dev-dependencies]
tempfile.workspace = true
