[package]
name = "moenarch-text-linguistics-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP API adapter for the text-linguistics library crate."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "text-linguistics-server"

[lib]
name = "text_linguistics_server"

[[bin]]
name = "text-linguistics-server"
path = "src/main.rs"

[dependencies]
runtime-core.workspace = true
clap.workspace = true
serde_json.workspace = true
text-linguistics = { package = "moenarch-text-linguistics", version = "0.1.0", path = "../text-linguistics" }
text-model-runtime = { package = "moenarch-text-model-runtime", version = "0.1.0", path = "../text-model-runtime", features = ["candle"] }
[features]
default = []
cuda = ["text-linguistics/cuda", "text-model-runtime/cuda"]
