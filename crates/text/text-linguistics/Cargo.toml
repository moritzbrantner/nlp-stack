[package]
name = "moenarch-text-linguistics"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local model-backed linguistic analysis pipeline for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "text_linguistics"

[dependencies]
runtime-core.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
text-core.workspace = true
text-lexical.workspace = true
text-transcripts = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
model-runtime = { workspace = true, optional = true }
[features]
default = []
tokenizers = ["dep:tokenizers"]
transcripts = ["dep:text-transcripts"]
model-bundles = ["dep:model-runtime"]
candle = ["tokenizers", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
cuda = ["candle", "candle-core/cuda"]
external-tests = ["candle", "model-bundles"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "pipeline"
harness = false
