[package]
name = "moenarch-text-retrieval-cli"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line adapter for the text-retrieval library crate."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "text-retrieval-cli"

[lib]
name = "text_retrieval_cli"

[[bin]]
name = "text-retrieval-cli"
path = "src/main.rs"

[dependencies]
runtime-core.workspace = true
clap.workspace = true
serde_json.workspace = true
text-retrieval = { package = "moenarch-text-retrieval", version = "=0.1.1", path = "../text-retrieval" }
