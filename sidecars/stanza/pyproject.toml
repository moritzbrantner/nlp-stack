[project]
name = "nlp-stack-stanza-sidecar"
version = "0.1.0"
description = "Local Stanza oracle sidecar for nlp-stack: en/de/es tokens, lemmas, POS, morphology and dependency syntax over HTTP/JSON."
requires-python = "==3.12.*"
license = "MIT OR Apache-2.0"
dependencies = [
    "stanza==1.15.0",
    "torch==2.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
